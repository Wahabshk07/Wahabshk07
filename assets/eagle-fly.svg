<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="35%" stop-color="#4a1942"/>
      <stop offset="65%" stop-color="#c44b1a"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="78%" cy="62%" r="35%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="haze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7a2e12" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Sunset sky -->
  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#sunGlow)"/>

  <!-- Mountains -->
  <path d="M0 250 L120 180 L220 240 L340 160 L480 230 L600 150 L760 220 L900 155 L1050 230 L1200 170 L1200 320 L0 320 Z"
        fill="#3b1d2a" opacity="0.55"/>
  <path d="M0 270 L160 210 L280 265 L420 200 L580 260 L720 195 L880 255 L1020 210 L1200 250 L1200 320 L0 320 Z"
        fill="#2a1420" opacity="0.7"/>

  <rect y="230" width="1200" height="90" fill="url(#haze)"/>

  <!-- Sun -->
  <circle cx="940" cy="200" r="42" fill="#ffe08a" opacity="0.95"/>
  <circle cx="940" cy="200" r="58" fill="#ffb347" opacity="0.25"/>

  <!-- Clouds -->
  <g fill="#ffd4a8" opacity="0.18">
    <ellipse cx="180" cy="70" rx="90" ry="22"/>
    <ellipse cx="240" cy="62" rx="60" ry="18"/>
    <ellipse cx="520" cy="48" rx="110" ry="20"/>
    <ellipse cx="1100" cy="90" rx="80" ry="18"/>
  </g>

  <!-- Eagle: flies full width, wings flap -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-120,155; 160,95; 400,130; 660,70; 960,115; 1320,80"
      keyTimes="0;0.18;0.4;0.62;0.82;1"
      dur="6.5s" repeatCount="indefinite"/>

    <g transform="scale(1.65)">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-5; 0,3; 0,-4; 0,0"
        dur="1.15s" repeatCount="indefinite" additive="sum"/>

      <!-- body -->
      <ellipse cx="0" cy="4" rx="22" ry="10" fill="#1a1208"/>
      <ellipse cx="24" cy="-2" rx="10" ry="7" fill="#1a1208"/>
      <polygon points="34,-2 46,0 34,3" fill="#e07a20"/>
      <path d="M-20 2 Q-38 -10 -46 6 Q-34 8 -22 8 Z" fill="#1a1208"/>

      <!-- upper wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-20 0 0; 24 0 0; -20 0 0"
          dur="0.5s" repeatCount="indefinite"/>
        <path d="M-6 0 Q-22 -58 10 -78 Q22 -42 12 -4 Z" fill="#0d0905"/>
        <path d="M0 -2 Q-10 -40 14 -56 Q18 -30 10 -2 Z" fill="#2c1a0c"/>
      </g>

      <!-- lower wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="14 0 0; -18 0 0; 14 0 0"
          dur="0.5s" repeatCount="indefinite"/>
        <path d="M-4 6 Q-30 52 4 62 Q14 32 8 8 Z" fill="#120c06"/>
      </g>
    </g>
  </g>

  <text x="600" y="292" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#ffe8c8" opacity="0.92">
    Abdul Wahab — Senior Engineer
  </text>
</svg>
