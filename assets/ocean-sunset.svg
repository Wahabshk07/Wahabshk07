<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Realistic sunset sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="18%" stop-color="#1b1140"/>
      <stop offset="40%" stop-color="#6b1d4a"/>
      <stop offset="58%" stop-color="#c43b2a"/>
      <stop offset="75%" stop-color="#f07820"/>
      <stop offset="100%" stop-color="#ffc45c"/>
    </linearGradient>

    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="35%" stop-color="#ffe08a"/>
      <stop offset="70%" stop-color="#ff9a3c"/>
      <stop offset="100%" stop-color="#ff6b2d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb14a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ff6a3d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff4d2e" stop-opacity="0"/>
    </radialGradient>

    <!-- Ocean depth -->
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4f7a"/>
      <stop offset="25%" stop-color="#0f3d66"/>
      <stop offset="60%" stop-color="#0a2a4a"/>
      <stop offset="100%" stop-color="#061828"/>
    </linearGradient>

    <!-- Sunset reflection on water -->
    <linearGradient id="waterShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb56b" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ff7a3c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a4f7a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#3e1f0a"/>
    </linearGradient>

    <linearGradient id="sail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6e8"/>
      <stop offset="100%" stop-color="#f0d2a8"/>
    </linearGradient>

    <!-- Soft wave clip -->
    <clipPath id="seaClip">
      <rect x="0" y="195" width="1200" height="165"/>
    </clipPath>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- Distant haze -->
  <rect y="140" width="1200" height="70" fill="#ff8a4a" opacity="0.18"/>

  <!-- Sun + glow (near horizon) -->
  <circle cx="860" cy="175" r="120" fill="url(#sunBloom)"/>
  <circle cx="860" cy="175" r="48" fill="url(#sunCore)"/>
  <circle cx="860" cy="175" r="28" fill="#fff4c8"/>

  <!-- Soft clouds -->
  <g fill="#ffd7b0" opacity="0.22">
    <ellipse cx="160" cy="70" rx="100" ry="20"/>
    <ellipse cx="220" cy="62" rx="70" ry="16"/>
    <ellipse cx="480" cy="55" rx="120" ry="18"/>
    <ellipse cx="1080" cy="80" rx="90" ry="16"/>
  </g>

  <!-- Horizon band -->
  <rect y="190" width="1200" height="14" fill="#ff9a55" opacity="0.35"/>

  <!-- Ocean base -->
  <rect y="195" width="1200" height="165" fill="url(#ocean)"/>

  <!-- Moving sunset reflection path on water -->
  <g clip-path="url(#seaClip)" opacity="0.85">
    <ellipse cx="860" cy="250" rx="90" ry="70" fill="url(#waterShine)">
      <animate attributeName="rx" values="80;100;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Animated wave layers -->
  <g fill="#2a6fa0" opacity="0.55">
    <path d="M0 220 Q 75 205 150 220 T 300 220 T 450 220 T 600 220 T 750 220 T 900 220 T 1050 220 T 1200 220 V360 H0 Z">
      <animate attributeName="d"
        dur="3.2s"
        repeatCount="indefinite"
        values="
          M0 220 Q 75 205 150 220 T 300 220 T 450 220 T 600 220 T 750 220 T 900 220 T 1050 220 T 1200 220 V360 H0 Z;
          M0 220 Q 75 235 150 220 T 300 220 T 450 220 T 600 220 T 750 220 T 900 220 T 1050 220 T 1200 220 V360 H0 Z;
          M0 220 Q 75 205 150 220 T 300 220 T 450 220 T 600 220 T 750 220 T 900 220 T 1050 220 T 1200 220 V360 H0 Z"/>
    </path>
  </g>

  <g fill="#1e5f8f" opacity="0.7">
    <path d="M0 240 Q 90 222 180 240 T 360 240 T 540 240 T 720 240 T 900 240 T 1080 240 T 1260 240 V360 H0 Z">
      <animate attributeName="d"
        dur="4s"
        repeatCount="indefinite"
        values="
          M0 240 Q 90 222 180 240 T 360 240 T 540 240 T 720 240 T 900 240 T 1080 240 T 1260 240 V360 H0 Z;
          M0 240 Q 90 258 180 240 T 360 240 T 540 240 T 720 240 T 900 240 T 1080 240 T 1260 240 V360 H0 Z;
          M0 240 Q 90 222 180 240 T 360 240 T 540 240 T 720 240 T 900 240 T 1080 240 T 1260 240 V360 H0 Z"/>
    </path>
  </g>

  <g fill="#134a73" opacity="0.85">
    <path d="M0 265 Q 100 248 200 265 T 400 265 T 600 265 T 800 265 T 1000 265 T 1200 265 V360 H0 Z">
      <animate attributeName="d"
        dur="2.6s"
        repeatCount="indefinite"
        values="
          M0 265 Q 100 248 200 265 T 400 265 T 600 265 T 800 265 T 1000 265 T 1200 265 V360 H0 Z;
          M0 265 Q 100 282 200 265 T 400 265 T 600 265 T 800 265 T 1000 265 T 1200 265 V360 H0 Z;
          M0 265 Q 100 248 200 265 T 400 265 T 600 265 T 800 265 T 1000 265 T 1200 265 V360 H0 Z"/>
    </path>
  </g>

  <!-- Sparkle highlights on water -->
  <g fill="#ffe6b0" opacity="0.45">
    <ellipse cx="300" cy="255" rx="18" ry="3">
      <animate attributeName="cx" values="280;340;280" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="275" rx="22" ry="3">
      <animate attributeName="cx" values="600;660;600" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="260" rx="26" ry="3">
      <animate attributeName="cx" values="960;1010;960" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Sailboat (bobs + drifts slowly) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 18,-3; 36,1; 54,-2; 72,0"
      dur="14s" repeatCount="indefinite"/>

    <g transform="translate(420,218)">
      <!-- gentle bob -->
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,4; 0,-2; 0,3; 0,0"
        dur="2.8s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-2 40 30; 2 40 30; -2 40 30"
        dur="2.8s" repeatCount="indefinite" additive="sum"/>

      <!-- hull -->
      <path d="M10 40 L95 40 L85 58 L22 58 Z" fill="url(#hull)"/>
      <path d="M14 40 L90 40 L86 46 L18 46 Z" fill="#a0522d" opacity="0.7"/>

      <!-- mast -->
      <rect x="48" y="-8" width="3" height="50" fill="#2b1a0c"/>

      <!-- mainsail -->
      <path d="M52 -6 L52 38 L92 34 Z" fill="url(#sail)" opacity="0.95"/>
      <!-- jib -->
      <path d="M48 -2 L48 36 L18 34 Z" fill="#fff0d8" opacity="0.9"/>

      <!-- flag -->
      <path d="M51 -8 L68 -12 L51 -2 Z" fill="#e63946">
        <animate attributeName="d"
          dur="1.2s"
          repeatCount="indefinite"
          values="
            M51 -8 L68 -12 L51 -2 Z;
            M51 -8 L66 -6 L51 -2 Z;
            M51 -8 L68 -12 L51 -2 Z"/>
      </path>

      <!-- small cabin -->
      <rect x="34" y="28" width="18" height="10" rx="1" fill="#5c3310"/>
    </g>
  </g>

  <!-- Flying / jumping dolphin -->
  <g>
    <!-- arc across the water -->
    <animateTransform attributeName="transform" type="translate"
      values="-80,250; 180,160; 420,95; 680,140; 980,210; 1280,280"
      keyTimes="0;0.2;0.42;0.62;0.82;1"
      dur="7s"
      repeatCount="indefinite"/>

    <g transform="scale(1.15)">
      <!-- slight rotation while flying -->
      <animateTransform attributeName="transform" type="rotate"
        values="25 0 0; -5 0 0; -20 0 0; 10 0 0; 30 0 0"
        keyTimes="0;0.25;0.5;0.75;1"
        dur="7s"
        repeatCount="indefinite"
        additive="sum"/>

      <!-- body -->
      <ellipse cx="0" cy="0" rx="34" ry="14" fill="#4a6d82"/>
      <ellipse cx="0" cy="2" rx="28" ry="9" fill="#7fa3b5" opacity="0.55"/>

      <!-- head / snout -->
      <ellipse cx="30" cy="2" rx="14" ry="9" fill="#4a6d82"/>
      <path d="M40 2 L58 6 L40 10 Z" fill="#3d5c70"/>

      <!-- eye -->
      <circle cx="36" cy="-1" r="2.2" fill="#0d1b24"/>
      <circle cx="36.6" cy="-1.5" r="0.7" fill="#ffffff"/>

      <!-- dorsal fin -->
      <path d="M-2 -10 Q 2 -34 14 -12 Z" fill="#3a5a6e"/>

      <!-- tail -->
      <path d="M-30 0 Q -50 -22 -58 -6 Q -46 0 -34 4 Z" fill="#3a5a6e"/>
      <path d="M-30 2 Q -48 24 -58 10 Q -44 6 -32 6 Z" fill="#3a5a6e"/>

      <!-- flipper -->
      <path d="M2 8 Q -6 28 10 22 Q 12 12 6 8 Z" fill="#355466"/>

      <!-- belly highlight -->
      <ellipse cx="6" cy="6" rx="18" ry="5" fill="#c8dbe6" opacity="0.35"/>
    </g>
  </g>

  <!-- Splash when dolphin near water (looping soft spray near mid path) -->
  <g opacity="0.0">
    <animate attributeName="opacity"
      values="0;0;0.8;0;0;0.7;0"
      keyTimes="0;0.18;0.22;0.3;0.78;0.84;1"
      dur="7s"
      repeatCount="indefinite"/>
    <g fill="#d7ecff">
      <circle cx="200" cy="210" r="3"/>
      <circle cx="210" cy="200" r="2"/>
      <circle cx="190" cy="205" r="2.5"/>
      <circle cx="960" cy="225" r="3"/>
      <circle cx="972" cy="214" r="2"/>
      <circle cx="950" cy="218" r="2.5"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="600" y="340" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="600" fill="#ffe8c8" opacity="0.92">
    Abdul Wahab  Senior Engineer
  </text>
</svg>
